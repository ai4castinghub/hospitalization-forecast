methods_long: "A mean ensemble of weekly quantiles, excluding AI4Casting_Hub-Quantile_Baseline and AI4Casting_Hub-Flatline. Replaces AI4Casting_Hub-Ensemble_v1 beginning with the 2026-11-14 reference date. For influenza peak forecasts, retains the previous ensemble method and eligibility: averages peak-week probabilities and takes the median of peak-incidence quantiles from eligible models, including AI4Casting_Hub-PeakBaseline."
