data_inputs: "PHO weekly hospital bed occupancy and influenza admissions through October 31, 2026."
methods: "Illustrative flatline occupancy forecasts and simple peak distributions; for format demonstration."
methods_long: "Uses the most recent available occupancy as a constant median with fixed multiplicative quantiles. Peak week is uniform over the season, and peak admissions quantiles are fixed multiples of the observed seasonal maximum. These values are illustrative, do not model spatial correlations, and are not calibrated forecasts."
