name: Hub Submission Validation (R)

on:
  workflow_dispatch:
  pull_request:
    branches: ['codex/seasonal-audit-base']
    paths:
      - 'model-output/**'
      - 'model-metadata/*'
      - '!**README**'

permissions:
  contents: read
  pull-requests: read

jobs:
  validate-submission:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: hubverse-org/hubverse-actions/validate-submission@v2
        with:
          summary: true
          skip_submit_window_check: true

  validate_and_check:
    runs-on: ubuntu-22.04  # R not supported for ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ---------- Git diff + path checks ----------

      - name: Fetch base branch
        if: github.event_name == 'pull_request'
        run: |
          # github.base_ref is the name of the base branch for the PR (e.g. "main")
          git fetch origin ${{ github.base_ref }}

      - name: Run git diff to find changed files
        if: github.event_name == 'pull_request'
        run: |
          # Three-dot syntax compares HEAD with the merge-base of base_ref and HEAD
          git diff --name-only origin/${{ github.base_ref }}...HEAD > changed_files.txt
          echo "Changed files:"
          cat changed_files.txt

      - name: Check if changes are outside allowed directories
        if: github.event_name == 'pull_request'
        run: |
          # Filter out files not in the allowed directories
          UNALLOWED_CHANGES=$(grep -vE '^model-metadata/|^model-output/' changed_files.txt || true)

          if [[ -n "$UNALLOWED_CHANGES" ]]; then
            echo "Error: Changes outside allowed directories detected:"
            echo "$UNALLOWED_CHANGES"
            exit 1
          else
            echo "All changes are within allowed directories."
          fi

      - name: Check 2026-2027 Saturday 11:30 p.m. submission deadline
        if: github.event_name == 'pull_request'
        continue-on-error: true
        run: python3 scripts/check-submission-deadline.py "$GITHUB_EVENT_PATH" changed_files.txt

      - name: Check simulated in-window submission time
        if: github.event_name == 'pull_request'
        run: |
          printf '%s\n' '{"action":"opened","pull_request":{"created_at":"2026-11-13T17:00:00Z","updated_at":"2026-11-13T17:00:00Z"}}' > "$RUNNER_TEMP/audit-event.json"
          python3 scripts/check-submission-deadline.py "$RUNNER_TEMP/audit-event.json" changed_files.txt

      - name: Validate optional influenza peak forecasts
        if: github.event_name == 'pull_request'
        run: |
          mapfile -t files < changed_files.txt
          python3 scripts/validate_peak_submissions.py "${files[@]}"
