name: Hub Submission Validation (R)

on:
  workflow_dispatch:
  pull_request:
    branches: main
    paths:
      - 'model-output/**'
      - 'model-metadata/*'
      - '!**README**'

permissions:
  contents: read
  pull-requests: read

jobs:
  validate-submission:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: hubverse-org/hubverse-actions/validate-submission@v2
        with:
          summary: false

  validate_and_check:
    runs-on: ubuntu-22.04  # R not supported for ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ---------- Git diff + path checks ----------

      - name: Fetch base branch
        if: github.event_name == 'pull_request'
        run: |
          # github.base_ref is the name of the base branch for the PR (e.g. "main")
          git fetch origin ${{ github.base_ref }}

      - name: Run git diff to find changed files
        if: github.event_name == 'pull_request'
        run: |
          # Three-dot syntax compares HEAD with the merge-base of base_ref and HEAD
          git diff --name-only origin/${{ github.base_ref }}...HEAD > changed_files.txt
          echo "Changed files:"
          cat changed_files.txt

      - name: Check if changes are outside allowed directories
        if: github.event_name == 'pull_request'
        run: |
          # Filter out files not in the allowed directories
          UNALLOWED_CHANGES=$(grep -vE '^model-metadata/|^model-output/' changed_files.txt || true)

          if [[ -n "$UNALLOWED_CHANGES" ]]; then
            echo "Error: Changes outside allowed directories detected:"
            echo "$UNALLOWED_CHANGES"
            exit 1
          else
            echo "All changes are within allowed directories."
          fi

      - name: Check 2026-2027 Saturday 11:30 p.m. submission deadline
        if: github.event_name == 'pull_request'
        run: python3 scripts/check-submission-deadline.py "$GITHUB_EVENT_PATH" changed_files.txt

      - name: Validate weekly dates and optional influenza peak forecasts
        if: github.event_name == 'pull_request'
        run: |
          mapfile -t files < changed_files.txt
          python3 scripts/validate_peak_submissions.py "${files[@]}"

  validation-summary:
    needs: [validate-submission, validate_and_check]
    if: ${{ always() && github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    steps:
      - name: Summarize all validation jobs
        env:
          HUBVERSE_RESULT: ${{ needs['validate-submission'].result }}
          ADDITIONAL_RESULT: ${{ needs.validate_and_check.result }}
        run: |
          if [[ "$HUBVERSE_RESULT" == success && "$ADDITIONAL_RESULT" == success ]]; then
            heading=':white_check_mark: **All validation checks passed.**'
          else
            heading=':x: **Not all validation checks passed.**'
          fi
          {
            echo '## Submission validation'
            echo
            echo "$heading"
            echo
            echo "- Hubverse validation: **$HUBVERSE_RESULT**"
            echo "- Submission paths, deadline, weekly dates, and peak forecasts: **$ADDITIONAL_RESULT**"
            echo
            echo "[View validation details]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID)"
          } > "$RUNNER_TEMP/summary.md"

      - name: Upload combined validation summary
        uses: actions/upload-artifact@v4
        with:
          name: submission-validation-results
          path: ${{ runner.temp }}/summary.md
          if-no-files-found: error
          retention-days: 1
