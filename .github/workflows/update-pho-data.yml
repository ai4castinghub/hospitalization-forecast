name: Update PHO target data

on:
  workflow_dispatch:
  schedule:
    # Run every Friday at 12:30 PM Toronto time.
    - cron: "30 12 * * 5"
      timezone: America/Toronto

permissions:
  contents: write

concurrency:
  group: update-pho-target-data
  cancel-in-progress: false

jobs:
  update-target-data:
    if: ${{ github.repository_owner == 'ai4castinghub' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dashboard retrieval dependency
        run: npm ci

      - name: Download PHO Outcomes data
        run: npm run fetch:pho-outcomes

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Install R dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::dplyr
            any::lubridate
            any::readr
            any::tidyr

      - name: Process PHO data into target data
        run: Rscript scripts/get_target_data.R

      - name: Commit changed source and target data
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add auxiliary-data/pho-outcomes.csv \
            auxiliary-data/target-data-archive/ \
            target-data/

          if git diff --cached --quiet; then
            echo "PHO data has not changed."
            exit 0
          fi

          git commit -m "Update PHO target data"
          git push
