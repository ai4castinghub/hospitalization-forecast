name: Monday hub forecast pipeline

on:
  schedule:
    - cron: "0 10 * * 1"
      timezone: America/Toronto
  workflow_dispatch:
    inputs:
      date:
        description: "Optional Saturday reference date (YYYY-MM-DD); defaults to the week after the newest target data"
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: monday-hub-forecast-pipeline-${{ github.ref }}
  cancel-in-progress: false

jobs:
  concatenate-before:
    uses: ./.github/workflows/concat-data.yml
    with:
      mode: all
    permissions:
      contents: write

  forecast:
    needs: concatenate-before
    if: ${{ github.repository_owner == 'ai4castinghub' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    outputs:
      reference_date: ${{ steps.generate.outputs.reference_date }}
    env:
      FORECAST_DATE: ${{ inputs.date }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Set up cached forecast dependencies
        uses: ./.github/actions/setup-forecast-r

      - name: Generate hub model forecasts
        id: generate
        shell: bash
        run: |
          if [ "$GITHUB_EVENT_NAME" = "schedule" ]; then
            Rscript scripts/hub-model-forecasts.R --scheduled
          elif [ -n "$FORECAST_DATE" ]; then
            Rscript scripts/hub-model-forecasts.R "--date=$FORECAST_DATE"
          else
            Rscript scripts/hub-model-forecasts.R
          fi

      - name: Generate optional seasonal peak forecasts
        continue-on-error: true
        env:
          PEAK_REFERENCE_DATE: ${{ steps.generate.outputs.reference_date }}
        shell: bash
        run: |
          if [[ "$PEAK_REFERENCE_DATE" < "2026-10-24" || "$PEAK_REFERENCE_DATE" > "2027-05-29" ]]; then
            echo "Seasonal peak models are not configured for $PEAK_REFERENCE_DATE."
          else
            Rscript scripts/hub-peak-forecasts.R "--date=$PEAK_REFERENCE_DATE"
          fi

      - name: Commit forecast files
        shell: bash
        run: |
          git add model-output/AI4Casting_Hub-Flatline/ \
            model-output/AI4Casting_Hub-Quantile_AR/ \
            model-output/AI4Casting_Hub-RF_Quantile_AR/ \
            model-output/AI4Casting_Hub-Quantile_Baseline/
          for directory in model-output/AI4Casting_Hub-PeakBaseline model-output/AI4Casting_Hub-PeakAR model-output/AI4Casting_Hub-PeakRF; do
            if [ -d "$directory" ]; then git add "$directory"; fi
          done
          if git diff --cached --quiet; then
            echo "No forecast changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update hub model forecasts"
          git push origin "HEAD:${GITHUB_REF_NAME}"

  concatenate-after:
    needs: forecast
    if: ${{ needs.forecast.outputs.reference_date != '' }}
    uses: ./.github/workflows/concat-data.yml
    with:
      mode: models
    permissions:
      contents: write

  ensemble:
    needs: [forecast, concatenate-after]
    if: ${{ needs.forecast.outputs.reference_date != '' }}
    uses: ./.github/workflows/hub-ensemble-forecasts.yml
    with:
      date: ${{ needs.forecast.outputs.reference_date }}
    permissions:
      contents: write

  concatenate-after-ensemble:
    needs: ensemble
    uses: ./.github/workflows/concat-data.yml
    with:
      mode: models
    permissions:
      contents: write
