name: Combine model outputs and target data

on:
  workflow_call:
    inputs:
      mode:
        description: Build both datasets or refresh model outputs only
        required: false
        type: string
        default: all
  workflow_dispatch:
    inputs:
      mode:
        description: Build both datasets or refresh model outputs only
        required: false
        type: choice
        options: [all, models]
        default: all

permissions:
  contents: write

jobs:
  concatenate:
    if: ${{ github.repository_owner == 'ai4castinghub' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CONCAT_MODE: ${{ inputs.mode || 'all' }}

    steps:
      - name: Check out latest branch files
        uses: actions/checkout@v6
        with:
          ref: ${{ github.ref_name }}

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Install R dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::dplyr
            any::readr
            any::tidyr
            any::lubridate
            any::purrr
            any::withr

      - name: Concatenate data
        shell: bash
        run: |
          if [ "$CONCAT_MODE" = "models" ]; then
            Rscript scripts/build_concatenated_hospitalization_target_and_forecast.R --models-only
          elif [ "$CONCAT_MODE" = "all" ]; then
            Rscript scripts/build_concatenated_hospitalization_target_and_forecast.R
          else
            echo "Invalid concatenation mode: $CONCAT_MODE" >&2
            exit 1
          fi

      - name: Commit concatenated data
        shell: bash
        run: |
          git add auxiliary-data/concatenated_model_output.csv
          if [ "$CONCAT_MODE" = "all" ]; then
            git add auxiliary-data/concatenated_hospitalization_data.csv
          fi
          if git diff --cached --quiet; then
            echo "No concatenated data changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update concatenated data"
          git push origin "HEAD:${GITHUB_REF_NAME}"
