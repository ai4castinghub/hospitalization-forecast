name: Set up ensemble R dependencies
description: Install and cache the R packages used by the hub ensemble

runs:
  using: composite
  steps:
    - name: Set up R
      uses: r-lib/actions/setup-r@v2
      with:
        r-version: release
        use-public-rspm: true
        extra-repositories: https://hubverse-org.r-universe.dev

    - name: Install and cache ensemble packages
      uses: r-lib/actions/setup-r-dependencies@v2
      with:
        cache: true
        cache-version: 2
        dependencies: '"hard"'
        packages: |
          any::dplyr
          any::hubEnsembles
          any::readr

    - name: Verify ensemble packages
      shell: bash
      run: |
        Rscript -e 'packages <- c("dplyr", "hubEnsembles", "readr"); missing <- packages[!vapply(packages, requireNamespace, logical(1), quietly = TRUE)]; if (length(missing)) stop("Missing R packages: ", paste(missing, collapse = ", ")); cat("Ensemble R packages are ready.\n")'
